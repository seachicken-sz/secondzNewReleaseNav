name: Convert image parts to PNG
on:
  push:
    branches: [main]
    paths:
      - 'img/image parts/**/*.svg'
      - 'img/new-release-nav-icon.svg'
      - 'img/og-card.svg'
      - '.github/workflows/image-parts-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG conversion support
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Export transparent PNG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import cairosvg
          from PIL import Image
          root = Path('img/image parts')
          for svg in root.rglob('*.svg'):
              output = svg.with_suffix('.png')
              png = cairosvg.svg2png(bytestring=svg.read_bytes(), scale=2)
              img = Image.open(io.BytesIO(png)).convert('RGBA')
              img.save(output, format='PNG', optimize=True)
              print(f'{svg} -> {output}: {img.width}x{img.height}')
          PY
      - name: Export iPhone and browser PNG icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import cairosvg

          source = Path('img/new-release-nav-icon.svg').read_bytes()
          for size, output in [
              (180, Path('apple-touch-icon.png')),
              (192, Path('img/new-release-nav-icon-192.png')),
              (512, Path('img/new-release-nav-icon-512.png')),
          ]:
              png = cairosvg.svg2png(bytestring=source, output_width=size, output_height=size)
              foreground = Image.open(BytesIO(png)).convert('RGBA')
              background = Image.new('RGBA', (size, size), '#ffffff')
              background.alpha_composite(foreground)
              background.convert('RGB').save(output, 'PNG', optimize=True)
              print(f'{output}: {size}x{size}')
          PY
      - name: Render social share image
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          from io import BytesIO
          source = Path('img/og-card.svg')
          raster = cairosvg.svg2png(bytestring=source.read_bytes(), output_width=1200, output_height=630)
          image = Image.open(BytesIO(raster)).convert('RGB')
          image.save('img/og-card.png', format='PNG', optimize=True)
          print(f'Created img/og-card.png: {image.width}x{image.height}')
          PY
      - name: Commit PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'img/image parts' apple-touch-icon.png img/new-release-nav-icon-192.png img/new-release-nav-icon-512.png img/og-card.png
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate PNG parts from SVG sources"
            git push
          fi
